[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "formal-reasoning-agent"
version = "0.0.1"
description = "A minimal, replayable search framework for formal reasoning experiments"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
formal-agent = "formal_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
